<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Oblivion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/oblivion.png" alt="" />
      <div>
        <h1>OBLIVION</h1>
        <span>SELLER WORKSPACE</span>
      </div>
      <b>0.1</b>
    </header>
    <h2>Всё для рабочего ритма.</h2>
    <p>Лоты, чаты и автоматизация FunPay в одном пространстве.</p>
    <button id="open">Открыть Oblivion ↗</button>
    <div class="grid">
      <button data-view="chats">Чаты</button><button data-view="lots">Лоты</button
      ><button data-view="automation">Автоматизация</button
      ><button data-view="settings">Настройки</button>
    </div>
    <footer>
      <span id="status" role="status">Проверяю активную вкладку…</span
      ><button id="pause">Пауза</button>
    </footer>
    <p class="links">
      <a href="https://github.com/44oblivion/oblivion" target="_blank" rel="noopener">GitHub</a> ·
      <a
        href="https://github.com/44oblivion/oblivion/blob/main/docs/PRIVACY.md"
        target="_blank"
        rel="noopener"
        >Конфиденциальность</a
      >
    </p>
    <script src="popup.js"></script>
  </body>
</html>
